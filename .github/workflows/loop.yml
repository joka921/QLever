# Rounds 6 and 8 of the reproducer, see `REPORT.md`: build only
# `IndexBuildLoopTest` (which builds the tiny named-graph test index of the
# failing tests over and over and checks it) at a fixed commit of QLever, cache
# that build, and run several instances of it in parallel, with different
# `jemalloc` settings. Round 6 (one long-running process per instance) found
# nothing in 31,574 builds; round 8 starts a new process for each build (or
# every 10 builds), like `ctest` does for each unit test, and reproduced both
# storms and a corruption. Round 12: does a host process that starts
# processes as fast as possible (`spawn-loop.sh`, many ASID rollovers) make
# even the long-running processes of round 6 fail? `asid-monitor.sh` logs the
# ASID rollovers on the host. Round 14: instead of `IndexBuildLoopTest`, only
# the stalling tests of `TransitivePathTest` and `JoinTest` (graph variables,
# named graphs), each in its own process, 4 (or 1) at a time. Round 16: the
# same with a separate working directory per instance (in round 14, parallel
# instances overwrote each other's index files), and the two mitigations
# (no `jemalloc` purging, THP `never` on the host). Round 18: some VMs don't
# reproduce at all (round 15/16), so test the `MALLOC_CONF` mitigation on 3
# VMs against 2 default VMs, all one test at a time, with more host info.
name: arm64 stall reproducer (index build loop)

on:
  push:
    branches: [ arm64-stall-repro ]
    paths: [ .github/workflows/loop.yml, Dockerfile.loop, index-loop.sh, IndexBuildLoopTest.cpp, spawn-loop.sh, asid-monitor.sh ]
  workflow_dispatch:

env:
  QLEVER_REF: 7f8b3be50d47ee3ca97ee6c85e93063760a1f04a

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: p1-default-a, parallel: 1, builds: "", spawn: 0, thp: "", malloc_conf: "", tests: "TransitivePathTest:*raph*EmptyPath* JoinTest:*joinTwoScansWithDifferentGraphs*" }
          - { name: p1-default-b, parallel: 1, builds: "", spawn: 0, thp: "", malloc_conf: "", tests: "TransitivePathTest:*raph*EmptyPath* JoinTest:*joinTwoScansWithDifferentGraphs*" }
          - { name: p1-nopurge-a, parallel: 1, builds: "", spawn: 0, thp: "", malloc_conf: "dirty_decay_ms:-1,muzzy_decay_ms:-1", tests: "TransitivePathTest:*raph*EmptyPath* JoinTest:*joinTwoScansWithDifferentGraphs*" }
          - { name: p1-nopurge-b, parallel: 1, builds: "", spawn: 0, thp: "", malloc_conf: "dirty_decay_ms:-1,muzzy_decay_ms:-1", tests: "TransitivePathTest:*raph*EmptyPath* JoinTest:*joinTwoScansWithDifferentGraphs*" }
          - { name: p1-nopurge-c, parallel: 1, builds: "", spawn: 0, thp: "", malloc_conf: "dirty_decay_ms:-1,muzzy_decay_ms:-1", tests: "TransitivePathTest:*raph*EmptyPath* JoinTest:*joinTwoScansWithDifferentGraphs*" }
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: repro
      - name: Print kernel and CPU information
        run: |
          uname -a
          lscpu
          free -m
          grep -m 4 -E 'CPU (implementer|variant|part|revision)' /proc/cpuinfo
          cat /sys/devices/system/cpu/cpu0/regs/identification/midr_el1 || true
          sudo dmesg | grep -iE 'hyper-?v|hv_|errat|smccc|psci|cpu features' | head -n 40 || true
          cat /sys/class/dmi/id/{sys_vendor,product_name,product_version,bios_version} 2> /dev/null || true
      - uses: actions/checkout@v4
        with:
          repository: ad-freiburg/qlever
          ref: ${{ env.QLEVER_REF }}
          path: qlever
      # Make the GitHub Actions cache available to `docker buildx`.
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1
      - name: Build IndexBuildLoopTest
        working-directory: qlever
        run: |
          mkdir repro && cp ../repro/{run-test-with-diagnostics.sh,index-loop.sh,IndexBuildLoopTest.cpp,fault-storm-watch.sh} repro/
          echo '!repro/' >> .dockerignore
          docker buildx build --progress=plain --target build \
            --cache-from type=gha,scope=index-loop \
            --cache-to type=gha,mode=max,scope=index-loop \
            -f ../repro/Dockerfile.loop .
      - name: Start the ASID monitor and the process spawner on the host
        run: |
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q bpftrace > /dev/null 2>&1 || echo "no bpftrace"
          sudo nohup repro/asid-monitor.sh 5 > "$RUNNER_TEMP/asid.txt" 2>&1 &
          if [ "${{ matrix.spawn }}" = 1 ]; then
            nohup repro/spawn-loop.sh 1 > /dev/null 2>&1 &
          fi
          if [ "${{ matrix.thp }}" = never ]; then
            echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
            echo never | sudo tee /sys/kernel/mm/transparent_hugepage/defrag
            echo 0 | sudo tee /sys/kernel/mm/transparent_hugepage/khugepaged/defrag
          fi
          sleep 15
          cat "$RUNNER_TEMP/asid.txt"
      - name: Loop
        working-directory: qlever
        run: |
          docker buildx build --progress=plain --target loop \
            --cache-from type=gha,scope=index-loop \
            --build-arg DURATION=1800 --build-arg PARALLEL=${{ matrix.parallel }} \
            --build-arg "MALLOC_CONF=${{ matrix.malloc_conf }}" \
            --build-arg "BUILDS_PER_PROCESS=${{ matrix.builds }}" \
            --build-arg "REPRO_TESTS=${{ matrix.tests }}" \
            --build-arg CACHE_BUST=${{ github.run_id }} \
            -f ../repro/Dockerfile.loop .
      - name: Print the ASID rollovers
        if: always()
        run: cat "$RUNNER_TEMP/asid.txt" || true
