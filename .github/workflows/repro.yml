# Try to reproduce the stalls (and corruptions) of the QLever unit tests on the
# arm64 GitHub runners with the kernel `7.0.0-1017-azure` with a reduced
# workload, see `repro.c`, `stress.sh`, and `ctest-loop.sh`.
#
# Round 1 (`memmove`, `zstd`, and `mixed` natively and `mixed` in `docker run`,
# 100 minutes each) found nothing. In round 2, building only five of the QLever
# unit tests and running them over and over via `ctest` (`qlever`) reproduced a
# stall in the first iteration. A stall in the full Docker build showed a storm
# of spurious page faults (~4 million per second in a `memmove`).
#
# Round 3 tests which conditions of the machine are needed for the stalls:
# `qlever` (as in round 2), `qlever-noswap` (without swap, which the
# compilation otherwise fills), and `qlever-nocompact` (without proactive
# compaction and without THP defragmentation).
name: arm64 stall reproducer

on:
  push:
    branches: [ arm64-stall-repro ]
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        kind: [ qlever, qlever-noswap, qlever-nocompact ]
    name: ${{ matrix.kind }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: repro
      - name: Print kernel and CPU information
        run: |
          uname -a
          lscpu | grep -E 'Model name|Stepping'
          free -m
          swapon --show
          sysctl vm.compaction_proactiveness vm.swappiness
      - name: Disable swap
        if: matrix.kind == 'qlever-noswap'
        run: |
          sudo swapoff -a
          free -m
      - name: Disable proactive compaction and THP defragmentation
        if: matrix.kind == 'qlever-nocompact'
        run: |
          sudo sysctl -w vm.compaction_proactiveness=0
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/defrag
          echo 0 | sudo tee /sys/kernel/mm/transparent_hugepage/khugepaged/defrag
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1
      - uses: actions/checkout@v4
        with:
          repository: ad-freiburg/qlever
          path: qlever
      - name: Build and loop the QLever tests in docker build
        working-directory: qlever
        run: |
          mkdir repro && cp ../repro/{run-test-with-diagnostics.sh,ctest-loop.sh} repro/
          echo '!repro/' >> .dockerignore
          docker buildx build --progress=plain --build-arg DURATION=5400 \
            --build-arg BUILD_JOBS=${{ matrix.kind == 'qlever-noswap' && 3 || 4 }} \
            -f ../repro/Dockerfile.qlever .
      - name: Print the swap and compaction counters
        if: always()
        run: |
          free -m
          grep -E '^(pswpin|pswpout|pgmigrate_success|compact_stall|compact_daemon_wake|thp_collapse_alloc|pgfault) ' /proc/vmstat
