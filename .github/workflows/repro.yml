# Try to reproduce the stalls (and corruptions) of the QLever unit tests on the
# arm64 GitHub runners with the kernel `7.0.0-1017-azure` with a reduced
# workload, see `repro.c`, `stress.sh`, and `ctest-loop.sh`.
#
# Round 1 (`memmove`, `zstd`, and `mixed` natively and `mixed` in `docker run`,
# 100 minutes each) found nothing. Round 2 adds the aspects of the original
# failures that round 1 lacked.
name: arm64 stall reproducer

on:
  push:
    branches: [ arm64-stall-repro ]
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        # `pool`: the copies run as tasks on a pool of mostly idle threads.
        # `pressure`: `mixed`, while a memory hog forces reclaim, compaction,
        #   and page migration.
        # `buildkit`: `mixed` in a `RUN` step of `docker build`.
        # `qlever`: the QLever unit tests that stalled, built and run in a
        #   `RUN` step of `docker build`, as in the CI of QLever.
        kind: [ pool, pressure, buildkit, qlever ]
    name: ${{ matrix.kind }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      DURATION: 6000
    steps:
      - uses: actions/checkout@v4
        with:
          path: repro
      - name: Print kernel and CPU information
        run: |
          uname -a
          lscpu | grep -E 'Model name|Stepping|Flags'
          sudo dmesg | grep -iE 'errat|workaround|sve' | head -n 50
          grep -r . /sys/kernel/mm/transparent_hugepage/ 2> /dev/null | grep -E 'enabled|defrag' || true
      - name: Install packages
        if: matrix.kind == 'pool' || matrix.kind == 'pressure'
        run: sudo apt-get update -q && sudo apt-get install -y -q gdb libzstd-dev stress-ng > /dev/null
      - name: Stress with a thread pool
        if: matrix.kind == 'pool'
        working-directory: repro
        run: |
          gcc -O2 -g -o repro repro.c -lzstd -lpthread
          ./stress.sh "$DURATION" ./repro pool 16 40
      - name: Stress under memory pressure
        if: matrix.kind == 'pressure'
        working-directory: repro
        run: |
          gcc -O2 -g -o repro repro.c -lzstd -lpthread
          stress-ng --vm 2 --vm-bytes 42% --timeout "${DURATION}s" --quiet &
          ./stress.sh "$DURATION" ./repro mixed 8 40
      - name: Set up Docker Buildx
        if: matrix.kind == 'buildkit' || matrix.kind == 'qlever'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1
      - name: Stress in docker build
        if: matrix.kind == 'buildkit'
        working-directory: repro
        run: |
          docker buildx build --progress=plain --build-arg DURATION="$DURATION" \
            -f Dockerfile.buildkit .
      - uses: actions/checkout@v4
        if: matrix.kind == 'qlever'
        with:
          repository: ad-freiburg/qlever
          path: qlever
      - name: Build and loop the QLever tests in docker build
        if: matrix.kind == 'qlever'
        working-directory: qlever
        run: |
          mkdir repro && cp ../repro/{run-test-with-diagnostics.sh,ctest-loop.sh} repro/
          echo '!repro/' >> .dockerignore
          docker buildx build --progress=plain --build-arg DURATION=9000 \
            -f ../repro/Dockerfile.qlever .
