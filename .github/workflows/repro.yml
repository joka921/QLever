# Try to reproduce the stalls (and corruptions) of the QLever unit tests on the
# arm64 GitHub runners with the kernel `7.0.0-1017-azure` with a reduced
# workload, see `REPORT.md` for the previous rounds.
#
# Round 4 showed that compaction is NOT the trigger (stall and corruption in
# the first iteration with `vm.compaction_proactiveness=0` and only 1k page
# migrations). Round 5 checks the next candidate: QLever links `jemalloc`,
# which returns freed memory to the kernel via `madvise` (`MADV_FREE` /
# `MADV_DONTNEED`), after which other threads write to these pages again.
# The synthetic workload (glibc `malloc`) never did that.
# - `qlever-nopurge`: `jemalloc` never returns memory (no `madvise`).
# - `qlever-purge0`: `jemalloc` returns freed memory immediately.
# - `qlever-nojemalloc`: QLever built without `jemalloc`.
# - `synth-madvfree`/`synth-madvdontneed`: `repro.c` with chunks that are
#   returned via `madvise` after each use and reused by other threads.
# - `synth-jemalloc`: the `mixed` workload with `jemalloc` (immediate purging).
name: arm64 stall reproducer

# Rounds 9 to 11: the QLever tests with default settings and
# `fault-storm-watch.sh`, to find out what ends a storm of page faults (see
# `REPORT.md`). Round 9: reading `/proc` doesn't, `SIGSTOP`/`SIGCONT` does.
# Round 10: moving the thread to another CPU ends it, pinning it to its CPU
# doesn't. Round 11: run the watcher as root on the host, where it can also
# read the kernel stack and trace the faults with `bpftrace`.
on:
  push:
    branches: [ arm64-stall-repro ]
    paths: [ .github/workflows/repro.yml ]
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        kind:
          - qlever-trace-1
          - qlever-trace-2
    name: ${{ matrix.kind }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: repro
      - name: Print kernel and CPU information
        run: |
          uname -a
          lscpu | grep -E 'Model name|Stepping'
          free -m
          sysctl vm.compaction_proactiveness vm.swappiness
          grep -r . /sys/kernel/mm/transparent_hugepage/ 2> /dev/null | grep -E 'enabled|defrag' || true
      - name: Stress the synthetic workload
        if: startsWith(matrix.kind, 'synth-')
        working-directory: repro
        env:
          QLEVER_TEST_STALL_SECONDS: 15
        run: |
          grep -E '^(pgmigrate_success|compact_stall) ' /proc/vmstat
          sudo apt-get update -q && sudo apt-get install -y -q gdb libzstd-dev libjemalloc2 > /dev/null
          gcc -O2 -g -o repro repro.c -lzstd -lpthread
          case "${{ matrix.kind }}" in
            synth-madvfree) ./stress.sh 9000 ./repro madvfree 8 20000 ;;
            synth-madvdontneed) ./stress.sh 9000 ./repro madvdontneed 8 3000 ;;
            synth-jemalloc)
              export MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0
              ./stress.sh 9000 env LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2 ./repro mixed 4 400 ;;
          esac
      - name: Set up Docker Buildx
        if: startsWith(matrix.kind, 'qlever-')
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
            env.BUILDKIT_STEP_LOG_MAX_SPEED=-1
      - uses: actions/checkout@v4
        if: startsWith(matrix.kind, 'qlever-')
        with:
          repository: ad-freiburg/qlever
          path: qlever
      - name: Start the fault storm watcher on the host
        if: startsWith(matrix.kind, 'qlever-trace')
        run: |
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q bpftrace > /dev/null 2>&1 || echo "no bpftrace"
          bpftrace --version || true
          sudo nohup repro/fault-storm-watch.sh 'Test|TransitivePath|CompressedRelat|OptionalJoin' > "$RUNNER_TEMP/storms.txt" 2>&1 &
      - name: Build and loop the QLever tests in docker build
        if: startsWith(matrix.kind, 'qlever-')
        working-directory: qlever
        run: |
          mkdir repro && cp ../repro/{run-test-with-diagnostics.sh,ctest-loop.sh,fault-storm-watch.sh} repro/
          echo '!repro/' >> .dockerignore
          case "${{ matrix.kind }}" in
            qlever-nopurge) ARGS="--build-arg MALLOC_CONF=dirty_decay_ms:-1,muzzy_decay_ms:-1" ;;
            qlever-purge0) ARGS="--build-arg MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0" ;;
            qlever-nojemalloc) ARGS="--build-arg NO_JEMALLOC=1" ;;
          esac
          if [[ "${{ matrix.kind }}" == qlever-trace* ]]; then ARGS="--build-arg NO_STORM_WATCH=1"; fi
          docker buildx build --progress=plain --build-arg DURATION=5400 $ARGS \
            -f ../repro/Dockerfile.qlever .
      - name: Print the storms that the watcher on the host found
        if: always() && startsWith(matrix.kind, 'qlever-trace')
        run: |
          pgrep -fa fault-storm-watc[h] || echo "the watcher is not running anymore"
          cat "$RUNNER_TEMP/storms.txt" || true
      - name: Print the swap and compaction counters
        if: always()
        run: |
          free -m
          grep -E '^(pswpin|pswpout|pgmigrate_success|compact_stall|compact_daemon_wake|thp_collapse_alloc|pgfault) ' /proc/vmstat
