# Strip QLever down to a minimal program that still triggers the kernel bug of
# the arm64 GitHub runners (see `REPORT.md` on the `arm64-stall-repro`
# branch): build natively (with `ccache` in the GitHub Actions cache, so that
# small changes rebuild fast), then run the commands of `strip/commands-*.txt`
# over and over, one process at a time, with `strip/loop.sh`.
name: arm64 strip

on:
  push:
    branches: [ arm64-strip ]
  workflow_dispatch:

jobs:
  strip:
    strategy:
      fail-fast: false
      matrix:
        # `env`: extra environment variables of the loop (`KEY=VALUE ...`),
        # `gdb`: run the storm watcher as root with `bpftrace` and attach `gdb`
        # to each storming thread.
        include:
          - { name: b-plain, commands: strip/commands-b.txt, env: "" }
          - { name: b-gdb-1, commands: strip/commands-b.txt, env: "", gdb: true }
          - { name: b-gdb-2, commands: strip/commands-b.txt, env: "", gdb: true }
          - { name: b-threads1, commands: strip/commands-b.txt, env: "QLEVER_REPRO_THREADS=1" }
          - { name: b-nopatterns, commands: strip/commands-b.txt, env: "QLEVER_REPRO_PATTERNS=0 QLEVER_REPRO_ALL_PERMUTATIONS=0" }
          - { name: b-serialparse, commands: strip/commands-b.txt, env: "QLEVER_REPRO_PARALLEL_PARSE=0" }
          - { name: b-nopurge, commands: strip/commands-b.txt, env: "MALLOC_CONF=dirty_decay_ms:-1,muzzy_decay_ms:-1" }
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - name: Print kernel and CPU information
        run: |
          uname -a
          lscpu | grep -E 'Model name|Stepping|^CPU\(s\)'
          free -m
      - name: Install dependencies
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q build-essential libicu-dev pkg-config uuid-dev libjemalloc-dev ninja-build libzstd-dev libssl-dev mold liburing-dev libboost1.83-dev libboost-program-options1.83-dev libboost-iostreams1.83-dev libboost-url1.83-dev libboost-container1.83-dev ccache gdb bpftrace > /dev/null
          cmake --version | head -n 1
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-strip-${{ github.sha }}
          restore-keys: |
            ccache-strip-
      - name: Build
        run: |
          ccache -z
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLOGLEVEL=INFO -D_NO_TIMING_TESTS=ON \
            -DCOMPILER_SUPPORTS_MARCH_NATIVE=FALSE -DCMAKE_CXX_FLAGS="-Wno-psabi" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold" -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=mold" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -GNinja \
            > cmake.log || { cat cmake.log; exit 1; }
          TARGETS=$(grep -ohE 'build/test/[A-Za-z0-9_]+' ${{ matrix.commands }} | sort -u | sed 's#build/test/##')
          echo "Targets: $TARGETS"
          time cmake --build build -j 4 --target $TARGETS > build.log 2>&1 || { tail -n 100 build.log; exit 1; }
          ccache -s | head -n 20
      # Only one job saves the cache (they all build the same).
      - name: Save ccache
        if: always() && matrix.name == 'b-plain'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-strip-${{ github.sha }}
      - name: Loop
        env:
          WATCH_REGEX: "Test|TransitivePath"
          DURATION: 900
        run: |
          for VAR in ${{ matrix.env }}; do export "$VAR"; done
          if [ "${{ matrix.gdb }}" = true ]; then
            export WATCH_SUDO=1 STORM_GDB=1
            # Let `gdb` attach to the tests.
            sudo sysctl -w kernel.yama.ptrace_scope=0
          fi
          # The commands refer to `build/test/...` relative to the checkout. A
          # line `@<binary> <gtest filter>` stands for all matching tests of the
          # binary, one per line.
          sed "s#build/test/#$PWD/build/test/#g" ${{ matrix.commands }} |
            while read -r LINE; do
              if [[ "$LINE" == @* ]]; then
                read -r BINARY FILTER <<< "${LINE#@}"
                "$BINARY" --gtest_list_tests --gtest_filter="$FILTER" |
                  awk -v b="$BINARY" '/^[^ ]/ {suite = $1} /^  / {print b " --gtest_filter=" suite $1}'
              else
                echo "$LINE"
              fi
            done > commands.txt
          wc -l commands.txt
          strip/loop.sh "$DURATION" 1 commands.txt | tee loop.log
          echo "=== Summary: $(grep -c '=== FAILURE' loop.log) failures," \
            "$(grep -c 'FAULT STORM' loop.log) storms," \
            "$(grep -c 'ENDED after affinity-other-cpu' loop.log) ended by moving the thread," \
            "$(grep -c 'ENDED after gdb' loop.log) ended by gdb"
          grep -E '=== instance' loop.log
