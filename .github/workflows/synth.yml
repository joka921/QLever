# Round 17: the synthetic workloads one process at a time (`STRESS_PARALLEL=1`),
# so that CPUs are idle: in round 16, the 30 graph tests failed every ~60 s
# one at a time, but never with 4 instances in parallel (all CPUs busy), and
# all synthetic workloads so far ran `nproc` processes in parallel.
#
# Round 13: `repro ptzap` (see `repro.c`), which targets a stale page-walk
# cache after page tables are freed by `MADV_DONTNEED` (round 11 traced the
# storms to a single address with a valid, present PTE). Each process runs
# for 60 s, one at a time.
#
# Round 12: as round 7 (below), and with a host process that starts processes
# as fast as possible (`spawn-loop.sh`, many ASID rollovers), with storms
# detected by `fault-storm-watch.sh` and ASID rollovers logged by
# `asid-monitor.sh` (both on the host).
#
# Round 7 of the reproducer, see `REPORT.md`: the synthetic workload of
# `repro.c` with chunks that are returned to the kernel via `madvise` after
# each use and reused by other threads. In contrast to round 5, the chunks are
# 2 MiB aligned and whole multiples of 2 MiB, so that `MADV_DONTNEED` empties
# whole page tables (like `jemalloc` does when it purges large extents).
name: arm64 stall reproducer (synthetic madvise)

on:
  push:
    branches: [ arm64-stall-repro ]
    paths: [ .github/workflows/synth.yml, repro.c, stress.sh, run-test-with-diagnostics.sh, spawn-loop.sh, asid-monitor.sh ]
  workflow_dispatch:

jobs:
  synth:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: serial-mixed-jemalloc, mode: mixed, kb: 1024, threads: 4, iterations: 400, spawn: 0, preload: jemalloc, nopin: "", parallel: 1, batch: 50 }
          - { name: serial-pool-jemalloc, mode: pool, kb: 1024, threads: 8, iterations: 200, spawn: 0, preload: jemalloc, nopin: "", parallel: 1, batch: 50 }
          - { name: serial-dontneed-2m, mode: madvdontneed, kb: 2048, threads: 4, iterations: 1500, spawn: 0, preload: "", nopin: "", parallel: 1, batch: 50 }
          - { name: serial-ptzap-unpinned, mode: ptzap, kb: 2048, threads: 2, iterations: 20, spawn: 0, preload: "", nopin: "1", parallel: 1, batch: 1 }
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Print kernel and CPU information
        run: |
          uname -a
          lscpu | grep -E 'Model name|Stepping'
          grep -r . /sys/kernel/mm/transparent_hugepage/ 2> /dev/null | grep -E 'enabled|defrag' || true
      - name: Start the ASID monitor, the storm watcher, and the spawner
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q gdb libzstd-dev libjemalloc2 bpftrace > /dev/null
          sudo nohup ./asid-monitor.sh 5 > "$RUNNER_TEMP/asid.txt" 2>&1 &
          sudo nohup ./fault-storm-watch.sh '^repro$' > "$RUNNER_TEMP/storms.txt" 2>&1 &
          if [ "${{ matrix.spawn }}" = 1 ]; then
            nohup ./spawn-loop.sh 1 > /dev/null 2>&1 &
          fi
          sleep 15
          cat "$RUNNER_TEMP/asid.txt"
      - name: Stress
        env:
          QLEVER_TEST_STALL_SECONDS: ${{ matrix.mode == 'ptzap' && 120 || 30 }}
          REPRO_CHUNK_KB: ${{ matrix.kb }}
          STRESS_PARALLEL: ${{ matrix.parallel }}
          STRESS_BATCH: ${{ matrix.batch }}
          PTZAP_NO_PIN: ${{ matrix.nopin }}
        run: |
          gcc -O2 -g -o repro repro.c -lzstd -lpthread
          [ -n "$PTZAP_NO_PIN" ] || unset PTZAP_NO_PIN
          [ -n "$STRESS_PARALLEL" ] || unset STRESS_PARALLEL
          /usr/bin/time -v ./repro ${{ matrix.mode }} ${{ matrix.threads }} 10 2>&1 | grep -E 'Elapsed|faults|STALL|CORRUPTION'
          if [ "${{ matrix.preload }}" = jemalloc ]; then
            export MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0
            ./stress.sh 3000 env LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libjemalloc.so.2 ./repro ${{ matrix.mode }} ${{ matrix.threads }} ${{ matrix.iterations }}
          else
            ./stress.sh 3000 ./repro ${{ matrix.mode }} ${{ matrix.threads }} ${{ matrix.iterations }}
          fi
          grep -E '^(pgfault|thp_fault_alloc|pgmigrate_success) ' /proc/vmstat
      - name: Print the storms and ASID rollovers
        if: always()
        run: |
          cat "$RUNNER_TEMP/storms.txt" || true
          cat "$RUNNER_TEMP/asid.txt" || true
